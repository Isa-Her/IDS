<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Galería de Productos</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
<div class="container">
<a class="navbar-brand" href="inicio.html">Tienda Sara</a>
</div>
</nav>

<div class="container mt-4">

<h1 class="text-center mb-4">Galería de Productos</h1>

<div class="row mb-4">

<div class="col-md-4">
<select class="form-select">
<option>Categoría</option>
<option>Electrónica</option>
<option>Ropa</option>
<option>Videojuegos</option>
</select>
</div>

<div class="col-md-4">
<select class="form-select">
<option>Marca</option>
<option>Samsung</option>
<option>Nike</option>
<option>Sony</option>
</select>
</div>

<div class="col-md-4">
<select class="form-select">
<option>Ordenar por</option>
<option>Precio</option>
<option>Popularidad</option>
<option>Relevancia</option>
</select>
</div>

</div>

<div class="row">

<div class="col-md-3 mb-4">
<div class="card">
<img src="img/tele1.jpg" class="card-img-top">
<div class="card-body">
<span class="badge bg-danger">Oferta</span>
<h5>Smart TV</h5>
<p>$12,000</p>
<button class="btn btn-success">Agregar al carrito</button>
</div>
</div>
</div>

<div class="col-md-3 mb-4">
<div class="card">
<img src="img/playstation1.jpg" class="card-img-top" height="230">
<div class="card-body">
<span class="badge bg-primary">Nuevo</span>
<h5>PlayStation 5</h5>
<p>$14,000</p>
<button class="btn btn-success">Agregar al carrito</button>
</div>
</div>
</div>

<div class="col-md-3 mb-4">
<div class="card">
<img src="img/tenis1.jpg" class="card-img-top">
<div class="card-body">
<h5>Tenis Nike</h5>
<p>$1,800</p>
<button class="btn btn-success">Agregar al carrito</button>
</div>
</div>
</div>

<div class="col-md-3 mb-4">
<div class="card">
<img src="img/tele2.jpg" class="card-img-top">
<div class="card-body">
<span class="badge bg-warning">Popular</span>
<h5>Monitor Samsung</h5>
<p>$4,500</p>
<button class="btn btn-success">Agregar al carrito</button>
</div>
</div>
</div>

</div>
