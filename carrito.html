<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Carrito de Compras</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
<div class="container">
<a class="navbar-brand" href="inicio.html">Tienda Sara</a>
</div>
</nav>

<div class="container mt-4">

<h1 class="text-center mb-4">Carrito de Compras</h1>

<table class="table table-bordered">

<thead class="table-dark">
<tr>
<th>Producto</th>
<th>Precio</th>
<th>Cantidad</th>
<th>Subtotal</th>
<th>Acción</th>
</tr>
</thead>

<tbody>

<tr>
<td>Smart TV</td>
<td>$12,000</td>
<td>
<input type="number" class="form-control" value="1">
</td>
<td>$12,000</td>
<td>
<button class="btn btn-danger">Eliminar</button>
</td>
</tr>

<tr>
<td>Tenis Nike</td>
<td>$1,800</td>
<td>
<input type="number" class="form-control" value="2">
</td>
<td>$3,600</td>
<td>
<button class="btn btn-danger">Eliminar</button>
</td>
</tr>

</tbody>

</table>

<div class="row">

<div class="col-md-6">

<div class="card">
<div class="card-body">

<h4>Cupón de Descuento</h4>

<input type="text" class="form-control mb-2" placeholder="Código">

<button class="btn btn-primary">
Aplicar Cupón
</button>

</div>
</div>

</div>

<div class="col-md-6">

<div class="card">
<div class="card-body">

<h4>Resumen del Pedido</h4>

<p>Subtotal: $15,600</p>
<p>Impuestos: $2,496</p>
<p>Envío: $250</p>

<hr>

<h4>Total: $18,346</h4>

<button class="btn btn-success">
Proceder al Pago
</button>

</div>
</div>

</div>

</div>

<div class="mt-4">

<a href="productos.html" class="btn btn-secondary">
Seguir Comprando
</a>

</div>

</div>

</body>
</html>
